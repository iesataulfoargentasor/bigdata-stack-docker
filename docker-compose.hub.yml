# Clúster mínimo de Hadoop a partir de las imágenes publicadas.
# No construye nada: docker compose baja profesorbigdata/*:v2.0 del Hub.
#
#   docker compose -f docker-compose.hub.yml up -d
#   docker compose -f docker-compose.hub.yml down

networks:
  hadoop-net:
    driver: bridge

volumes:
  namenode-data:
  datanode-data:

services:

  namenode:
    image: profesorbigdata/hadoop-namenode-image-profesor:v2.0
    container_name: namenode
    hostname: namenode
    command: ["bash", "/opt/bd/start-daemons.sh"]
    ports:
      - "9870:9870"
    volumes:
      - ./NameNode/Config-files/start-daemons-namenode.sh:/opt/bd/start-daemons.sh:ro
      - namenode-data:/var/data/hadoop/hdfs
    networks:
      - hadoop-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  resourcemanager:
    image: profesorbigdata/hadoop-resourcemanager-image-profesor:v2.0
    container_name: resourcemanager
    hostname: resourcemanager
    command: ["bash", "/opt/bd/start-daemons.sh"]
    ports:
      - "8088:8088"
    volumes:
      - ./ResourceManager/Config-files/start-daemons-resourcemanager.sh:/opt/bd/start-daemons.sh:ro
    networks:
      - hadoop-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8032'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  dnnm:
    image: profesorbigdata/hadoop-datanode-image-profesor:v2.0
    container_name: dnnm
    hostname: dnnm
    command: ["bash", "/opt/bd/start-daemons.sh"]
    depends_on:
      namenode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
    ports:
      - "9864:9864"
      - "8042:8042"
    volumes:
      - ./DataNode-NodeManager/Config-files/start-daemons-dnnm.sh:/opt/bd/start-daemons.sh:ro
      - datanode-data:/var/data/hadoop/hdfs
    networks:
      - hadoop-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9866 && echo > /dev/tcp/localhost/8042'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  client:
    image: profesorbigdata/hadoop-client-image-profesor:v2.0
    container_name: client
    hostname: client
    command: /opt/bd/start-client.sh
    depends_on:
      hdfs-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
      resourcemanager:
        condition: service_healthy
      dnnm:
        condition: service_healthy
    ports:
      - "8889:8889"
    volumes:
      - ./notebooks:/media/notebooks
    networks:
      - hadoop-net

  hdfs-init:
    image: profesorbigdata/hadoop-client-image-profesor:v2.0
    user: hdadmin
    command: ["bash", "/opt/bd/init-hdfs.sh"]
    volumes:
      - ./scripts/init-hdfs.sh:/opt/bd/init-hdfs.sh:ro
    depends_on:
      namenode:
        condition: service_healthy
      dnnm:
        condition: service_healthy
    networks:
      - hadoop-net
    restart: "no"
