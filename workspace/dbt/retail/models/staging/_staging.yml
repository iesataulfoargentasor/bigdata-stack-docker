version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              values: [COMPLETE, CLOSED, PENDING_PAYMENT, PROCESSING, PENDING,
                       ON_HOLD, PAYMENT_REVIEW, CANCELED, SUSPECTED_FRAUD]
  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
