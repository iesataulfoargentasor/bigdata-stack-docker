name: retail
version: "1.0.0"
config-version: 2

profile: retail

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Con schema main en profiles.yml, los modelos acaban en main_staging y main_marts.
models:
  retail:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
