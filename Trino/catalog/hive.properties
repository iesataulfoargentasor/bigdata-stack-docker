# Tablas registradas en el metastore de Hive.
# Los ficheros pueden vivir en HDFS (hdfs://namenode:9000/...) o en MinIO (s3a://bucket/...).
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083

# HDFS del clúster
fs.hadoop.enabled=true
hive.config.resources=/etc/trino/hadoop/core-site.xml,/etc/trino/hadoop/hdfs-site.xml

# MinIO (API S3)
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin

# Permite INSERT en tablas externas (las que apuntan a una ruta propia)
hive.non-managed-table-writes-enabled=true
